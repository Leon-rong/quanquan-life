<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <title>清理缓存 - 拳拳成长记录</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background: #fff5f0; color: #5a3e36;
    }
    h1 { margin-bottom: 12px; }
    p { color: #8a6e66; }
  </style>
</head>
<body>
  <h1>🧹 正在清理旧版缓存</h1>
  <p id="status">正在注销 Service Worker 并清空缓存…</p>
  <script>
    (async function () {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
          status.textContent = 'Service Worker 已注销。';
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          status.textContent = '本地缓存已清空。';
        }
      } catch (e) {
        status.textContent = '清理过程出错：' + e.message;
      }
      status.textContent = '清理完成，2 秒后自动进入首页…';
      setTimeout(function () {
        window.location.replace('./index.html?v=15');
      }, 2000);
    })();
  </script>
</body>
</html>
